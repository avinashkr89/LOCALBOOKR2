version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: localbookr-db
    environment:
      POSTGRES_DB: localbookr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - localbookr-network

  redis:
    image: redis:7-alpine
    container_name: localbookr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - localbookr-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: localbookr-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/localbookr
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key-change-in-production
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    command: npm run dev
    networks:
      - localbookr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: localbookr-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev
    networks:
      - localbookr-network

volumes:
  postgres_data:
  redis_data:

networks:
  localbookr-network:
    driver: bridge